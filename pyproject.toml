[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-monitor"
version = "0.1.0"
description = "Offline numeric CSV batch drift monitoring"
requires-python = ">=3.11"
dependencies = ["typer==0.15.2", "click==8.1.8", "python-dotenv==1.1.0", "numpy==1.26.4", "scipy==1.15.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-cov==6.0.0", "ruff==0.11.2", "mypy==1.15.0", "pre-commit==4.2.0"]

[project.scripts]
batch-monitor = "batch_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
