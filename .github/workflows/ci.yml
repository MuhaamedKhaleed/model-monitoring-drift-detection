name: CI
on:
  push:
    branches: [main, monitoring-engineering-pilot]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install development package
        run: python -m pip install -e '.[dev]'
      - name: Offline tests
        run: python -m pytest --cov=batch_monitor --cov-report=term-missing
      - name: Lint
        run: python -m ruff check src tests
      - name: Format
        run: python -m ruff format --check src tests
      - name: Types
        run: python -m mypy src
      - name: Pre-commit
        run: python -m pre_commit run --all-files
      - name: CLI
        run: python -m batch_monitor --help
      - name: Build container
        run: docker build --tag batch-monitor:ci .
      - name: Container smoke checks
        run: |
          docker run --rm batch-monitor:ci --help
          test "$(docker run --rm --entrypoint id batch-monitor:ci -u)" = 10001
          set +e
          docker run --rm batch-monitor:ci --current /missing.csv --reference /missing.csv
          status=$?
          set -e
          test "$status" = 2
